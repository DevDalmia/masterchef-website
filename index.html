<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MasterChef 4 Many | CNP</title>
    <style>
      :root {
        --brand-orange: #b34522;
        --brand-charcoal: #1a1a1a;
        --brand-cream: #fdf9f9;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--brand-cream);
        color: var(--brand-charcoal);
      }

      .cnp-section {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 48px 20px;
      }

      .cnp-card {
        max-width: 1100px;
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 32px;
        align-items: center;
        background: #fffaf7;
        border: 1px solid #f3d0c9;
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(179, 69, 34, 0.1);
        overflow: hidden;
      }

      .cnp-card img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }

      .cnp-content {
        padding: 32px;
      }

      .eyebrow {
        display: inline-block;
        margin-bottom: 12px;
        color: var(--brand-orange);
        font-size: 12px;
        letter-spacing: 0.18em;
        font-weight: 700;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(2.25rem, 5vw, 4rem);
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: rgba(26, 26, 26, 0.75);
        line-height: 1.7;
        font-size: 1.05rem;
      }

      @media (max-width: 760px) {
        .cnp-card {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="cnp-section">
      <section class="cnp-card" aria-label="Children's Nutrition Project">
        <img
          src="https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1200&q=80"
          alt="Children's Nutrition Project"
        />

        <div class="cnp-content">
          <span class="eyebrow">CNP</span>
          <h1>Children's Nutrition Project</h1>
          <p>
            We provide balanced, high-protein meals to children in need, creating a more
            nourished, hopeful future for every family we reach.
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
